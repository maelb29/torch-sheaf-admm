# @package _global_
# Geometric-shapes classification: 8x8 images split into four non-overlapping 4x4 patches.
task: geometric
model_type: sheaf

training:
  lr: 1.0e-3
  weight_decay: 1.0e-7
  epochs: 20
  K_train: 20
  K_eval: 100
  loss_window: 2
  train_iters_dist: fixed
  val_interval: 5

data:
  dir: datasets/geometric
  train_split: train
  val_splits: [test]
  loader: image

task_cfg:
  patch_size: 4
  stride: 4
  connectivity: 8
  num_classes: 4

model:
  num_classes: 4
  d_v: 32
  d_e: 24
  encoder_arch: mlp
  enc_hidden_dim: 256
  comm_norm_type: layernorm
  objective_mode: lasso
  l1_weight: 0.006337180166370117
  x_solver: diagonal_prox
  z_solver: unrolled_cg
  z_mode: project
  cg_iters: 5
  tikhonov_eps: 1.0e-5
  rm_sharing: global
  rm_init: orthonormal
  rm_mode: context
  lora_rank: 8
  lora_init_style: legacy
  num_directions: 8
  rho_init: 0.12
  decoder_arch: classification
  dec_linear_head: true
  dec_readout_mode: x_only
